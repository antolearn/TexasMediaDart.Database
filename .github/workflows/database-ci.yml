name: SQL Database CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-validate:
    name: Build and Validate SQL Database
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore SQL Project
        run: dotnet restore src/TexasMediaDart.Database/TexasMediaDart.Database.sqlproj

      - name: Generate build version
        id: version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $build = "{0:D4}" -f [int]$env:GITHUB_RUN_NUMBER
          $version = "$date.$build"

          "BUILD_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "version=$version" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append

          Write-Host "Database Build Version: $version"

          "### Database Build Version" >> $env:GITHUB_STEP_SUMMARY
          "**$version**" >> $env:GITHUB_STEP_SUMMARY

      - name: Build SQL Project for Azure SQL
        run: >
          dotnet build
          src/TexasMediaDart.Database/TexasMediaDart.Database.sqlproj
          --configuration Release
          /p:DSP=Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider

      - name: Verify DACPAC Exists
        shell: pwsh
        run: |
          $dacpac = "src/TexasMediaDart.Database/bin/Release/TexasMediaDart.Database.dacpac"

          if (-not (Test-Path $dacpac)) {
              Write-Error "DACPAC was not generated."
              exit 1
          }

          Write-Host "DACPAC successfully generated:"
          Write-Host $dacpac

      - name: Create versioned DACPAC
        shell: pwsh
        run: |
          $source =
            "src/TexasMediaDart.Database/bin/Release/TexasMediaDart.Database.dacpac"

          $artifactDirectory = "artifacts"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $artifactDirectory | Out-Null

          $destination =
            "$artifactDirectory/TexasMediaDart.Database-$env:BUILD_VERSION.dacpac"

          Copy-Item `
            -Path $source `
            -Destination $destination

          Write-Host "Versioned DACPAC:"
          Write-Host $destination

      - name: Upload versioned DACPAC artifact
        uses: actions/upload-artifact@v4
        with:
          name: TexasMediaDart.Database-${{ env.BUILD_VERSION }}
          path: artifacts/TexasMediaDart.Database-${{ env.BUILD_VERSION }}.dacpac
          if-no-files-found: error
          retention-days: 30