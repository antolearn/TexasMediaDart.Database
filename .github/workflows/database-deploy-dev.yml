name: Build and Deploy SQL Database - DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release DACPAC
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore SQL Project
        run: dotnet restore src/TexasMediaDart.Database/TexasMediaDart.Database.sqlproj

      - name: Build SQL Project for Azure SQL
        run: >
          dotnet build
          src/TexasMediaDart.Database/TexasMediaDart.Database.sqlproj
          --configuration Release
          /p:DSP=Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider

      - name: Verify DACPAC
        shell: pwsh
        run: |
          $dacpac = "src/TexasMediaDart.Database/bin/Release/TexasMediaDart.Database.dacpac"

          if (-not (Test-Path $dacpac)) {
              Write-Error "DACPAC was not generated."
              exit 1
          }

          Write-Host "DACPAC generated successfully:"
          Write-Host $dacpac

      - name: Upload Release DACPAC
        uses: actions/upload-artifact@v4
        with:
          name: TexasMediaDart.Database
          path: src/TexasMediaDart.Database/bin/Release/TexasMediaDart.Database.dacpac
          retention-days: 30

  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: windows-latest
    environment: DEV

    steps:
      - name: Download Release DACPAC
        uses: actions/download-artifact@v4
        with:
          name: TexasMediaDart.Database
          path: dacpac

      - name: Deploy DACPAC to DEV
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: dacpac/TexasMediaDart.Database.dacpac
          action: publish